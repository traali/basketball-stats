<!DOCTYPE html>
<html lang="fi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Game Card MCP App</title>
  <style>
    :root {
      --bg: #0B132B;
      --card: #1C2541;
      --accent: #5BC0BE;
      --highlight: #6FFFE9;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 14px; }
    .header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; text-align: center; margin-bottom: 14px; }
    .team { font-weight: 700; font-size: 14px; max-width: 110px; }
    .score { font-size: 28px; font-weight: 900; color: #FFF; }
    .quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 11px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin-bottom: 12px; }
    .q-label { color: var(--muted); font-size: 10px; }
    .q-val { font-weight: 700; color: var(--highlight); }
    .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(91, 192, 190, 0.2); color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span>🏀 Koripallo Basket.fi</span>
      <span class="badge" id="statusBadge">LOPPUTULOS</span>
    </div>

    <div class="score-row">
      <div class="team" id="homeName">Honka</div>
      <div class="score" id="scoreDisplay">68 : 62</div>
      <div class="team" id="awayName">LePy</div>
    </div>

    <div class="quarters">
      <div>
        <div class="q-label">Q1</div>
        <div class="q-val" id="q1">18–14</div>
      </div>
      <div>
        <div class="q-label">Q2</div>
        <div class="q-val" id="q2">16–15</div>
      </div>
      <div>
        <div class="q-label">Q3</div>
        <div class="q-val" id="q3">20–18</div>
      </div>
      <div>
        <div class="q-label">Q4</div>
        <div class="q-val" id="q4">14–15</div>
      </div>
    </div>

    <div style="font-size: 11px; color: var(--muted); display: flex; justify-content: space-between;">
      <span>⭐ Pistehai: J. Virtanen (22p)</span>
      <span>Virheet: 2 - 3</span>
    </div>
  </div>

  <script>
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'mcp:init') {
        window.parent.postMessage({ type: 'mcp:ready', protocolVersion: '2026-01' }, '*');
      }
    });
  </script>
</body>
</html>
