name: Monastic Clean-Room Pre-Visitation Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pre-visitation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monastery Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Pre-Visitation Protocol
        run: npm run visit
