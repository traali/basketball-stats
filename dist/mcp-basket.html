<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Game Card</title>
  <style>
    :root {
      --bg: #0B132B;
      --card: #1C2541;
      --accent: #5BC0BE;
      --ice: #6FFFE9;
      --text: #F4F4F5;
      --muted: #94A3B8;
      --line: color-mix(in srgb, #f4f4f5 12%, transparent);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .score-row { display: flex; justify-content: space-between; align-items: center; text-align: center; margin-bottom: 14px; gap: 8px; }
    .team { font-weight: 600; font-size: 14px; max-width: 110px; }
    .score { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 11px; background: var(--bg); padding: 8px; border-radius: 12px; margin-bottom: 12px; }
    .q-label { color: var(--muted); font-size: 10px; }
    .q-val { font-weight: 600; color: var(--ice); font-variant-numeric: tabular-nums; }
    .badge { font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .empty { color: var(--muted); font-size: 13px; padding: 24px 8px; text-align: center; }
    .meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p class="empty" id="empty">Odotetaan otteludataa (matchId).</p>
  </div>
  <script>
    // Renders a game card from data the embedding host passes in (mcp:init).
    // Text only (no innerHTML), score only for played/live games, blank quarters stay blank.
    const params = new URLSearchParams(location.search || location.hash.replace(/^#/, ''))
    const matchId = params.get('matchId') || ''
    const LABEL = { played: 'Lopputulos', live: 'Live', upcoming: 'Tuleva', forfeit: 'Luovutus', unscheduled: 'Aika avoin',
      unreported: 'Ei tulosta', unconfirmed: 'Tulos vahvistamatta', postponed: 'Siirretty', cancelled: 'Peruttu' }

    function el(tag, cls, text) {
      const n = document.createElement(tag)
      if (cls) n.className = cls
      if (typeof text === 'string' || typeof text === 'number') n.textContent = String(text)
      return n
    }
    const isNum = (v) => typeof v === 'number' && Number.isFinite(v)

    function render(data) {
      const phase = String(data.phase || data.state || '')
      const home = String(data.homeTeamName || data.home || 'Koti')
      const away = String(data.awayTeamName || data.away || 'Vieras')
      const sh = data.scoreHome, sa = data.scoreAway
      const showScore = (phase === 'played' || phase === 'live') && isNum(sh) && isNum(sa)
      const card = document.getElementById('card')
      card.replaceChildren()

      const header = el('div', 'header')
      header.append(el('span', '', 'Basket.fi' + (matchId ? ' · ' + matchId : '')))
      if (LABEL[phase]) header.append(el('span', 'badge', LABEL[phase]))
      card.append(header)

      const row = el('div', 'score-row')
      row.append(el('div', 'team', home), el('div', 'score', showScore ? sh + ' – ' + sa : 'vs'), el('div', 'team', away))
      card.append(row)

      const qs = Array.isArray(data.quarters) ? data.quarters : []
      if (showScore && qs.length) {
        const grid = el('div', 'quarters')
        for (let i = 1; i <= 4; i++) {
          const q = qs.find((x) => x && x.quarter === i) || {}
          const h = q.scoreHome, a = q.scoreAway
          const cell = el('div')
          cell.append(el('div', 'q-label', 'Q' + i), el('div', 'q-val', isNum(h) && isNum(a) ? h + '–' + a : ''))
          grid.append(cell)
        }
        card.append(grid)
      }

      const leader = Array.isArray(data.leaders) && data.leaders[0]
      if (leader && isNum(leader.points)) {
        const meta = el('div', 'meta')
        meta.append(el('span', '', 'Eniten pisteitä: ' + String(leader.playerName || '') + ' (' + leader.points + ' p)'))
        card.append(meta)
      }
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || window.parent === window) return
      const d = event.data
      if (!d || d.type !== 'mcp:init') return
      if (/^https?:\/\//.test(event.origin)) {
        window.parent.postMessage({ type: 'mcp:ready', protocolVersion: '2026-01' }, event.origin)
      }
      const payload = d.payload || d.result || d.match
      if (payload && typeof payload === 'object') render(payload)
    })
  </script>
</body>
</html>
